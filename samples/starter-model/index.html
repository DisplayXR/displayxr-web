<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>starter-model — DisplayXR inline-3D template</title>
<link rel="icon" href="data:,">
<style>
  /* The page colour behind the tile == the model's clearColor (BG in app.js). */
  html,body{margin:0;background:#e9e6df;color:#1d1f24;font:16px/1.55 system-ui,-apple-system,Segoe UI,sans-serif}
  .wrap{max-width:1100px;margin:0 auto;padding:32px 20px 60px}
  a{color:#2459c7}
  /* The product's HTML sits BESIDE the tile, never over it: the model comes out of the glass, and
     2D UI over pop-out content is a depth conflict. Narrow screens stack it below. */
  .product{display:grid;grid-template-columns:minmax(0,640px) minmax(260px,1fr);gap:32px;align-items:center}
  @media (max-width:860px){.product{grid-template-columns:1fr}}
  /* Visually bare canvas: no border/radius/shadow/filter/opacity/animated transform on it, its
     ancestors or anything over it. */
  .stage{position:relative}
  #tile{display:block;width:100%;aspect-ratio:16/9;touch-action:none;cursor:grab}
  /* Cover until loaded + woven, removed in one step (never faded). */
  #cover{position:absolute;inset:0;background:#e9e6df}
  .kicker{font-size:13px;letter-spacing:.08em;text-transform:uppercase;color:#6a6458;margin:0}
  h1{font-size:32px;line-height:1.15;margin:4px 0 8px}
  .price{font-size:22px;font-weight:600;margin:0 0 14px}
  .desc{color:#4a4d55;margin:0 0 20px}
  button{font:inherit;border-radius:8px;cursor:pointer}
  #buy{background:#1d1f24;color:#fff;border:0;padding:11px 22px;font-weight:600}
  .view{margin-top:26px;padding-top:16px;border-top:1px solid rgba(0,0,0,0.12);display:grid;gap:10px}
  .view label{display:flex;gap:10px;align-items:center;font-size:14px}
  .view input{flex:1}
  #mode{background:transparent;border:1px solid rgba(0,0,0,0.25);padding:6px 14px;justify-self:start}
  #modeNote{font-size:13px;color:#6a6458;margin:0}
</style>
</head>
<body>
<div class="wrap">
  <div class="product">
    <div class="stage">
      <canvas id="tile"></canvas>
      <div id="cover"></div>
    </div>
    <div>
      <p class="kicker">Bath collection</p>
      <h1>The Classic Duck</h1>
      <p class="price">$12.00</p>
      <p class="desc">Turn it with a drag, zoom with the wheel. On a 3D display it sits in the glass
         and turns slowly when you leave it alone.</p>
      <button id="buy" type="button">Add to cart</button>
      <div class="view">
        <label>Depth <input id="depth" type="range" min="0" max="1" step="0.05" value="1"></label>
        <button id="mode" type="button">Show in 2D</button>
        <p id="modeNote"></p>
      </div>
    </div>
  </div>
  <p style="margin-top:28px;font-size:14px">Model: Duck (Draco variant) from the Khronos
     glTF-Sample-Assets, © Sony, CC0 1.0. ← <a href="../README.md">Starter templates</a> ·
     <a href="../../docs/making-3d-look-right.md">Making 3D that looks right</a></p>
</div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.180.0/examples/jsm/",
  "playcanvas": "https://cdn.jsdelivr.net/npm/playcanvas@2.22.3/build/playcanvas.mjs",
  "@displayxr/inline3d": "../../js/inline3d.js",
  "@displayxr/inline3d/three": "../../js/inline3d-three.js",
  "@displayxr/inline3d/viewer": "../../js/inline3d-viewer.js",
  "@displayxr/inline3d/model": "../../js/inline3d-model-entry.js"
} }
</script>
<script type="module" src="./app.js"></script>
</body>
</html>
