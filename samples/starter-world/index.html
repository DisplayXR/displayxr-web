<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>starter-world — DisplayXR inline-3D template</title>
<link rel="icon" href="data:,">
<style>
  html,body{margin:0;background:#15171c;color:#e6e8ee;font:16px/1.6 system-ui,-apple-system,Segoe UI,sans-serif}
  .wrap{max-width:1000px;margin:0 auto;padding:28px 20px 60px}
  h1{font-size:26px;margin:0 0 4px}
  p{color:#aab0bd;margin:0 0 18px}
  a{color:#6aa8ff}
  /* The canvas is visually bare: no border/radius/shadow/filter/opacity/transform animation on it
     or on anything around or over it (they take it out of the weave or split it between eyes). */
  .stage{position:relative}
  #world{display:block;width:100%;aspect-ratio:16/9;touch-action:none;cursor:grab}
  /* HUD at the TOP: there the ceiling is behind the glass. The floor at the bottom edge is the
     nearest thing in a walk-through, so never put UI there. A plain rgba() background is fine;
     opacity, blur and filters are not. */
  #hud{position:absolute;top:10px;left:0;right:0;margin:0 auto;width:max-content;padding:4px 12px;
       border-radius:6px;background:rgba(10,12,16,0.62);color:#e6e8ee;font-size:13px;pointer-events:none}
  /* Cover until handle.firstWoven, removed in one step (never faded). */
  #cover{position:absolute;inset:0;background:#15171c}
</style>
</head>
<body>
<div class="wrap">
  <h1>A room to walk through</h1>
  <p>A first-person scene on a camera rig: the room sits just behind the glass, like a view
     through a window. Walk with WASD or the arrow keys; drag to look around.</p>
  <div class="stage">
    <canvas id="world"></canvas>
    <div id="hud">loading…</div>
    <div id="cover"></div>
  </div>
  <p style="margin-top:18px">← <a href="../README.md">Starter templates</a> ·
     <a href="../../docs/making-3d-look-right.md">Making 3D that looks right</a></p>
</div>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.180.0/build/three.module.js",
  "@displayxr/inline3d": "../../js/inline3d.js",
  "@displayxr/inline3d/three": "../../js/inline3d-three.js"
} }
</script>
<script type="module" src="./app.js"></script>
</body>
</html>
