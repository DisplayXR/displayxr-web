name: auto3d three.js canary

# Weekly: does the newest three.js still have every hook the auto3d WebGPURenderer driver uses, and has
# the harness been run on it? threejs.org's examples move to each three release the day it ships, so
# a release the driver cannot drive turns those pages 2D with no other signal (r187, 2026-11:
# webgpu_loader_gltf). See tools/auto3d-shim/README.md, "Keeping up with three.js".
# No GPU or browser needed: tools/auto3d-shim/test/three-canary.mjs reads the published source.

on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:
  pull_request:
    paths:
      - "tools/auto3d-shim/three-adapter.js"
      - "tools/auto3d-shim/test/three-canary.mjs"
      - ".github/workflows/auto3d-three-canary.yml"

permissions:
  contents: read
  issues: write

jobs:
  canary:
    name: three@latest vs the WebGPURenderer driver
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run the canary
        id: canary
        run: |
          set +e
          node tools/auto3d-shim/test/three-canary.mjs latest | tee canary.txt
          code=${PIPESTATUS[0]}
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "rev=$(sed -n 's/^three@0\.\([0-9]*\)\..*/\1/p' canary.txt | head -1)" >> "$GITHUB_OUTPUT"
          # 0 ok, 2 newer-but-hooks-present (warn), 1 hook gone (fail), 3 canary itself broken (fail).
          if [ "$code" = 2 ]; then echo "::warning::$(sed -n 2p canary.txt)"; exit 0; fi
          exit "$code"
      - name: Open or update the tracking issue
        # Only on the schedule / manual runs: a PR shows the result in its checks instead.
        if: always() && github.event_name != 'pull_request' && (steps.canary.outputs.code == '1' || steps.canary.outputs.code == '2')
        env:
          GH_TOKEN: ${{ github.token }}
          REV: ${{ steps.canary.outputs.rev }}
        run: |
          title="auto3d: three r${REV} canary"
          body="$(printf 'The weekly canary (`%s`, run %s) reports:\n\n```\n%s\n```\n\nSee tools/auto3d-shim/README.md, *Keeping up with three.js*.' \
            "tools/auto3d-shim/test/three-canary.mjs" "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" "$(cat canary.txt)")"
          n="$(gh issue list --state open --search "\"$title\" in:title" --json number,title --jq ".[] | select(.title==\"$title\") | .number" | head -1)"
          if [ -n "$n" ]; then gh issue comment "$n" --body "$body"; else gh issue create --title "$title" --body "$body"; fi
