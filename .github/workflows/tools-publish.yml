name: Publish inline3d-tools to npm

# Publishes @displayxr/inline3d-tools (tools/inline3d-tools/) to npm from CI via TRUSTED PUBLISHING
# (OIDC), like sdk-publish.yml does for the SDK: no npm token exists anywhere. A release is:
#     (bump tools/inline3d-tools/package.json "version", run scripts/sync-agents.mjs, merge)
#     git tag tools-vX.Y.Z && git push origin tools-vX.Y.Z
# The tag version MUST match tools/inline3d-tools/package.json "version" (checked below).
#
# One-time bootstrap (a trusted publisher attaches per package, and the package must exist first):
# publish a stub of @displayxr/inline3d-tools manually, configure the Trusted Publisher on npm for
# THIS workflow file (tools-publish.yml), then CI publishes the real version with provenance.
# See docs/publishing.md.
#
# workflow_dispatch with dry_run=true does everything except the upload.

on:
  push:
    tags:
      - "tools-v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Test + pack but do NOT publish"
        type: boolean
        default: true

permissions:
  contents: read
  id-token: write # npm provenance (public repo)

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/inline3d-tools
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: "https://registry.npmjs.org"

      # Trusted publishing (OIDC) needs npm >= 11.5.1; Node 22 ships 10.x.
      - name: Upgrade npm for trusted publishing
        run: npm install -g npm@latest

      - name: Install pinned dependencies
        run: npm ci

      - name: Unit + MCP tests, AGENTS.md / plugin pins in sync
        run: |
          node --test test/*.test.mjs
          node scripts/sync-agents.mjs --check

      - name: Verify tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          PKG_VER="$(node -p "require('./package.json').version")"
          TAG_VER="${GITHUB_REF_NAME#tools-v}"
          echo "package.json=$PKG_VER  tag=$TAG_VER"
          if [ "$PKG_VER" != "$TAG_VER" ]; then
            echo "::error::tag tools-v$TAG_VER does not match tools/inline3d-tools/package.json version $PKG_VER"
            exit 1
          fi

      - name: Smoke-test the packed tarball
        run: |
          npm pack
          TGZ="$PWD/$(ls displayxr-inline3d-tools-*.tgz)"
          mkdir -p "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke"
          npx -y --package="$TGZ" inline3d-tools --version
          npx -y --package="$TGZ" inline3d-tools gen providers
          npx -y --package="$TGZ" inline3d-tools scaffold esm page
          rm "$TGZ"

      # No NODE_AUTH_TOKEN: authentication is per-run OIDC (trusted publishing). Requires a Trusted
      # Publisher configured on npm for @displayxr/inline3d-tools, pointing at DisplayXR/displayxr-web
      # + tools-publish.yml.
      - name: Publish (dry run)
        if: github.event_name == 'workflow_dispatch' && inputs.dry_run
        run: npm publish --provenance --access public --dry-run

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && !inputs.dry_run)
        run: npm publish --provenance --access public
