name: inline3d-tools CI

# Tests for tools/inline3d-tools (the @displayxr/inline3d-tools package) and the Claude plugin that
# runs it: unit + MCP tests, AGENTS.md / plugin pin / Codex-plugin drift, and the Claude plugin
# folder staying directory-compliant (Markdown/JSON/images only: no scripts, hooks, bin or MCP
# config). plugins/displayxr-inline3d-codex/ is generated and has an MCP config by design.

on:
  push:
    branches: [main]
    paths:
      - "tools/inline3d-tools/**"
      - "plugins/**"
      - ".claude-plugin/**"
      - "test/plugin/**"
      - ".github/workflows/tools-ci.yml"
  pull_request:
    paths:
      - "tools/inline3d-tools/**"
      - "plugins/**"
      - ".claude-plugin/**"
      - "test/plugin/**"
      - ".github/workflows/tools-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install pinned dependencies
        working-directory: tools/inline3d-tools
        run: npm ci
      - name: Unit + MCP tests
        working-directory: tools/inline3d-tools
        run: node --test test/*.test.mjs
      - name: AGENTS.md, plugin pins and the Codex plugin in sync with the skills
        run: node tools/inline3d-tools/scripts/sync-agents.mjs --check
      - name: Plugin folder is directory-compliant
        run: node tools/inline3d-tools/scripts/scan-plugin.mjs plugins/displayxr-inline3d
      - name: Packed tarball runs
        working-directory: tools/inline3d-tools
        run: |
          npm pack
          npx -y --package="$PWD/$(ls displayxr-inline3d-tools-*.tgz)" inline3d-tools --version
