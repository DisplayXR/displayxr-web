<!doctype html>
<!-- TEST PAGE — a raw-WebGL tiled world, the way a globe / 3D-map renderer draws one (no engine, no
     library): terrain tiles, each drawn with ITS OWN model-view-projection matrix (relative-to-centre
     tiles), in two passes (ground, then extruded blocks), a sky as a full-screen pass with no matrix,
     labels and pins as screen-space quads with no matrix (positions projected on the CPU), and a
     separate 2D overlay <canvas> above the GL canvas with text labels. Renders ON DEMAND (only when
     the camera changes, as a map does). Cases: cases/globe.mjs.
     ?mode=tilt   (default) tilted perspective over relief: a world (converts)
     ?mode=flat   straight down on a flat ground, perspective: no relief in view (stays 2D)
     ?mode=ortho  an orthographic 2D map: no clip matrix at all (stays 2D)
     ?mvp=split   one projection for all draws + per-draw model-view (an engine's layout): not a tiled world (stays 2D)
     window.__setCam({ dist, pitch, yaw, tx, tz }) moves the camera (one redraw); window.__frozen once drawn.
     Label colour is pure magenta (255, 0, 255), the pins pure cyan: the harness finds them by colour. -->
<html><head><meta charset="utf-8"><link rel="icon" href="data:,"><title>globe tiles (test)</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}#gl,#ov{position:absolute;left:0;top:0;width:100%;height:100%;display:block}#ov{pointer-events:none}</style>
</head><body>
<canvas id="gl"></canvas><canvas id="ov"></canvas>
<script>
(() => {
  const q = new URLSearchParams(location.search);
  const MODE = q.get('mode') || 'tilt', SPLIT = q.get('mvp') === 'split';
  const cv = document.getElementById('gl'), ov = document.getElementById('ov');
  const dpr = 1;
  cv.width = innerWidth * dpr; cv.height = innerHeight * dpr; ov.width = cv.width; ov.height = cv.height;
  const gl = cv.getContext('webgl', { alpha: false, antialias: false, preserveDrawingBuffer: true });
  const N = 16, TILE = 100, GRID = 16; // 16 x 16 tiles of 100 units, 16 x 16 quads each
  // Each tile's model ORIGIN sits DROP units below the ground (a bounding-box corner, as real tile
  // formats do), so tile origins alone put the ground too far; ?origin=surface puts it on the ground.
  const DROP = q.get('origin') === 'surface' ? 0 : 150;
  const height = (x, z) => MODE === 'flat' || MODE === 'ortho' ? 0 : 60 * Math.sin(x * 0.004) * Math.cos(z * 0.005) + 25 * Math.sin(x * 0.013 + z * 0.011);

  // ---- programs
  const sh = (type, src) => { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; };
  const prog = (vs, fs) => { const p = gl.createProgram(); gl.attachShader(p, sh(gl.VERTEX_SHADER, vs)); gl.attachShader(p, sh(gl.FRAGMENT_SHADER, fs)); gl.linkProgram(p); return p; };
  const terrainP = prog(SPLIT
    ? 'attribute vec3 p; attribute vec3 c; uniform mat4 proj; uniform mat4 mv; varying vec3 vc; void main(){ vc=c; gl_Position=proj*mv*vec4(p,1.0); }'
    : 'attribute vec3 p; attribute vec3 c; uniform mat4 mvp; varying vec3 vc; void main(){ vc=c; gl_Position=mvp*vec4(p,1.0); }',
    'precision mediump float; varying vec3 vc; void main(){ gl_FragColor=vec4(vc,1.0); }');
  const skyP = prog('attribute vec2 a; varying float y; void main(){ y=a.y; gl_Position=vec4(a,0.0,1.0); }',
    'precision mediump float; varying float y; void main(){ gl_FragColor=vec4(mix(vec3(0.55,0.7,0.9),vec3(0.2,0.35,0.7),y*0.5+0.5),1.0); }');
  const quadP = prog('attribute vec2 a; attribute vec3 c; varying vec3 vc; void main(){ vc=c; gl_Position=vec4(a,0.0,1.0); }',
    'precision mediump float; varying vec3 vc; void main(){ gl_FragColor=vec4(vc,1.0); }');

  // ---- geometry: one terrain mesh per tile (local coordinates: the tile's corner is its origin)
  const tiles = [];
  // aperiodic texture (a hash per vertex: no checkerboard for a block matcher to alias on), tinted by height
  const hash = (x, z) => { const s = Math.sin(x * 127.1 + z * 311.7) * 43758.5453; return s - Math.floor(s); };
  const col = (gx, gz, h) => { const k = 0.55 + 0.45 * hash(gx, gz); const t = (h + 85) / 170; return [k * (0.3 + 0.5 * t), k * (0.6 - 0.25 * t), k * (0.25 + 0.3 * hash(gz, gx))]; };
  for (let tz = 0; tz < N; tz++) for (let tx = 0; tx < N; tx++) {
    const ox = (tx - N / 2) * TILE, oz = (tz - N / 2) * TILE;
    const v = [], idx = [];
    for (let j = 0; j <= GRID; j++) for (let i = 0; i <= GRID; i++) {
      const lx = i * TILE / GRID, lz = j * TILE / GRID, h = height(ox + lx, oz + lz);
      v.push(lx, h + DROP, lz, ...col(tx * GRID + i, tz * GRID + j, h));
    }
    for (let j = 0; j < GRID; j++) for (let i = 0; i < GRID; i++) { const a = j * (GRID + 1) + i, b = a + 1, c = a + GRID + 1, d = c + 1; idx.push(a, c, b, b, c, d); }
    // the second pass: a block on some tiles
    const bv = [], bi = [];
    if ((tx * 7 + tz * 3) % 4 === 0 && MODE === 'tilt') {
      const cx = TILE / 2, cz = TILE / 2, hb = height(ox + cx, oz + cz), s = 18, ht = 40 + ((tx * 13 + tz * 5) % 5) * 15;
      const P = [[-s, 0, -s], [s, 0, -s], [s, 0, s], [-s, 0, s], [-s, ht, -s], [s, ht, -s], [s, ht, s], [-s, ht, s]];
      const faces = [[0, 1, 5, 4, 0.9], [1, 2, 6, 5, 0.7], [2, 3, 7, 6, 0.8], [3, 0, 4, 7, 0.6], [4, 5, 6, 7, 1.0]];
      for (const f of faces) { const base = bv.length / 6; for (let k = 0; k < 4; k++) { const p = P[f[k]]; bv.push(cx + p[0], hb + p[1] + DROP, cz + p[2], f[4] * 0.95, f[4] * 0.9, f[4] * 0.8); } bi.push(base, base + 1, base + 2, base, base + 2, base + 3); }
    }
    const mk = (arr, T) => { const b = gl.createBuffer(); gl.bindBuffer(T, b); gl.bufferData(T, T === gl.ARRAY_BUFFER ? new Float32Array(arr) : new Uint16Array(arr), gl.STATIC_DRAW); return b; };
    tiles.push({ ox, oz, v, vb: mk(v, gl.ARRAY_BUFFER), ib: mk(idx, gl.ELEMENT_ARRAY_BUFFER), n: idx.length, bvb: bi.length ? mk(bv, gl.ARRAY_BUFFER) : null, bib: bi.length ? mk(bi, gl.ELEMENT_ARRAY_BUFFER) : null, bn: bi.length });
  }
  const skyB = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, skyB); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  const quadB = gl.createBuffer();
  const anchors = [[-300, -200], [150, -350], [320, 120], [-120, 260], [0, 0], [-450, 400]].map(([x, z]) => [x, height(x, z), z]);

  // ---- matrices (column-major)
  const mul = (a, b) => { const o = new Float32Array(16); for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++) { let s = 0; for (let k = 0; k < 4; k++) s += a[k * 4 + r] * b[c * 4 + k]; o[c * 4 + r] = s; } return o; };
  const persp = (fy, asp, n, f) => { const t = 1 / Math.tan(fy / 2), o = new Float32Array(16); o[0] = t / asp; o[5] = t; o[10] = (f + n) / (n - f); o[11] = -1; o[14] = 2 * f * n / (n - f); return o; };
  const ortho = (w, h, n, f) => { const o = new Float32Array(16); o[0] = 2 / w; o[5] = 2 / h; o[10] = -2 / (f - n); o[14] = -(f + n) / (f - n); o[15] = 1; return o; };
  const cam = (window.__cam = { dist: 900, pitch: MODE === 'tilt' ? 0.75 : Math.PI / 2 - 1e-4, yaw: 0.3, tx: 0, tz: 0 });
  function view() { // camera at a distance from the target, looking at it
    const cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch), cy = Math.cos(cam.yaw), sy = Math.sin(cam.yaw);
    const ty = height(cam.tx, cam.tz);
    const eye = [cam.tx + cam.dist * cp * sy, ty + cam.dist * sp, cam.tz + cam.dist * cp * cy];
    const f = [cam.tx - eye[0], ty - eye[1], cam.tz - eye[2]]; const fl = Math.hypot(...f); f[0] /= fl; f[1] /= fl; f[2] /= fl;
    let r = [f[1] * 0 - f[2] * 1, f[2] * 0 - f[0] * 0, f[0] * 1 - f[1] * 0]; const rl = Math.hypot(...r) || 1; r = r.map((x) => x / rl);
    const u = [r[1] * f[2] - r[2] * f[1], r[2] * f[0] - r[0] * f[2], r[0] * f[1] - r[1] * f[0]];
    const m = new Float32Array(16);
    m[0] = r[0]; m[4] = r[1]; m[8] = r[2]; m[1] = u[0]; m[5] = u[1]; m[9] = u[2]; m[2] = -f[0]; m[6] = -f[1]; m[10] = -f[2];
    m[12] = -(r[0] * eye[0] + r[1] * eye[1] + r[2] * eye[2]); m[13] = -(u[0] * eye[0] + u[1] * eye[1] + u[2] * eye[2]); m[14] = f[0] * eye[0] + f[1] * eye[1] + f[2] * eye[2]; m[15] = 1;
    return { m, eye };
  }
  const T = (x, y, z) => { const o = new Float32Array(16); o[0] = o[5] = o[10] = o[15] = 1; o[12] = x; o[13] = y; o[14] = z; return o; };

  // ---- glyph-like label quads: a magenta block per anchor (screen space), a cyan pin under it
  function drawFrame() {
    const W = cv.width, H = cv.height, asp = W / H;
    gl.viewport(0, 0, W, H);
    gl.clearColor(0, 0, 0, 1); gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);
    // sky (no matrix)
    gl.disable(gl.DEPTH_TEST); gl.useProgram(skyP);
    gl.bindBuffer(gl.ARRAY_BUFFER, skyB); const sa = gl.getAttribLocation(skyP, 'a'); gl.enableVertexAttribArray(sa); gl.vertexAttribPointer(sa, 2, gl.FLOAT, false, 0, 0);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4); gl.disableVertexAttribArray(sa);
    // terrain + blocks (a matrix per tile)
    const { m: V } = view();
    const P = MODE === 'ortho' ? ortho(cam.dist * 2 * asp, cam.dist * 2, -5000, 5000) : persp(0.7, asp, 5, 20000);
    const VP = mul(P, V);
    gl.enable(gl.DEPTH_TEST); gl.depthFunc(gl.LEQUAL); gl.useProgram(terrainP);
    const lp = gl.getAttribLocation(terrainP, 'p'), lc = gl.getAttribLocation(terrainP, 'c');
    const um = gl.getUniformLocation(terrainP, SPLIT ? 'mv' : 'mvp'), up = SPLIT ? gl.getUniformLocation(terrainP, 'proj') : null;
    if (SPLIT) gl.uniformMatrix4fv(up, false, P);
    gl.enableVertexAttribArray(lp); gl.enableVertexAttribArray(lc);
    const pass = (vb, ib, n, t) => { gl.bindBuffer(gl.ARRAY_BUFFER, vb); gl.vertexAttribPointer(lp, 3, gl.FLOAT, false, 24, 0); gl.vertexAttribPointer(lc, 3, gl.FLOAT, false, 24, 12); gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER, ib); gl.uniformMatrix4fv(um, false, SPLIT ? mul(V, T(t.ox, -DROP, t.oz)) : mul(VP, T(t.ox, -DROP, t.oz))); gl.drawElements(gl.TRIANGLES, n, gl.UNSIGNED_SHORT, 0); };
    for (const t of tiles) pass(t.vb, t.ib, t.n, t);            // pass 1: ground
    for (const t of tiles) if (t.bn) pass(t.bvb, t.bib, t.bn, t); // pass 2: blocks
    gl.disableVertexAttribArray(lp); gl.disableVertexAttribArray(lc);
    // labels + pins: screen-space quads (no matrix), projected on the CPU
    const q = [];
    const o2 = ov.getContext('2d'); o2.clearRect(0, 0, ov.width, ov.height); o2.font = '16px sans-serif'; o2.fillStyle = '#fff';
    window.__anchors = [];
    for (const a of anchors) {
      const c = [0, 1, 2, 3].map((r) => VP[r] * a[0] + VP[4 + r] * a[1] + VP[8 + r] * a[2] + VP[12 + r]);
      if (c[3] <= 0) continue;
      const x = c[0] / c[3], y = c[1] / c[3];
      if (Math.abs(x) > 0.95 || Math.abs(y) > 0.95) continue;
      const lw = 60 / W, lh = 14 / H, pw = 8 / W, ph = 8 / H;
      const box = (x0, y0, x1, y1, r, g, b) => q.push(x0, y0, r, g, b, x1, y0, r, g, b, x0, y1, r, g, b, x0, y1, r, g, b, x1, y0, r, g, b, x1, y1, r, g, b);
      box(x - pw, y, x + pw, y + 2 * ph, 0, 1, 1);                    // pin (cyan)
      box(x + 2 * pw, y + 2 * ph, x + 2 * pw + 2 * lw, y + 2 * ph + 2 * lh, 1, 0, 1); // label (magenta)
      window.__anchors.push({ x, y, w: c[3] });
      o2.fillText('label', (x * 0.5 + 0.5) * ov.width + 40, (0.5 - y * 0.5) * ov.height - 24);
    }
    gl.disable(gl.DEPTH_TEST); gl.useProgram(quadP);
    gl.bindBuffer(gl.ARRAY_BUFFER, quadB); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(q), gl.DYNAMIC_DRAW);
    const qa = gl.getAttribLocation(quadP, 'a'), qc = gl.getAttribLocation(quadP, 'c');
    gl.enableVertexAttribArray(qa); gl.enableVertexAttribArray(qc);
    gl.vertexAttribPointer(qa, 2, gl.FLOAT, false, 20, 0); gl.vertexAttribPointer(qc, 3, gl.FLOAT, false, 20, 8);
    gl.drawArrays(gl.TRIANGLES, 0, q.length / 5);
    gl.disableVertexAttribArray(qa); gl.disableVertexAttribArray(qc);
    window.__frames = (window.__frames || 0) + 1;
  }
  // on demand, as a map: a frame when the camera changes, plus a short burst after load (tiles "streaming in")
  let want = 360; // ~6 s of frames after load (tiles streaming in), then on demand
  // ~5 s in, every ground tile's vertex buffer is uploaded again (a streamed refinement, as a map does)
  let n = 0;
  const tick = () => {
    if (want > 0) {
      if (++n === 300) for (const t of tiles) { gl.bindBuffer(gl.ARRAY_BUFFER, t.vb); gl.bufferData(gl.ARRAY_BUFFER, new Float32Array(t.v), gl.STATIC_DRAW); }
      want--; drawFrame(); if (want === 0) window.__frozen = true;
    }
    requestAnimationFrame(tick);
  };
  requestAnimationFrame(tick);
  window.__setCam = (o) => { Object.assign(cam, o); want = Math.max(want, 1); };
  window.__redraw = (n) => { want = Math.max(want, n || 1); };
  let drag = null;
  cv.addEventListener('pointerdown', (e) => { drag = { x: e.clientX, y: e.clientY, yaw: cam.yaw, pitch: cam.pitch }; });
  addEventListener('pointerup', () => { drag = null; });
  addEventListener('pointermove', (e) => { if (!drag) return; cam.yaw = drag.yaw + (e.clientX - drag.x) * 0.005; if (MODE === 'tilt') cam.pitch = Math.min(1.5, Math.max(0.2, drag.pitch + (e.clientY - drag.y) * 0.005)); want = Math.max(want, 1); });
  cv.addEventListener('wheel', (e) => { cam.dist = Math.min(20000, Math.max(60, cam.dist * Math.exp(e.deltaY * 0.001))); want = Math.max(want, 1); e.preventDefault(); }, { passive: false });
})();
</script>
</body></html>
