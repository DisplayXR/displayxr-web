<!doctype html>
<!-- TEST PAGE — the smallest stand-in for a three.js page rendered with WebGPURenderer
     (threejs-journey, bruno-simon in the corpus). No three.js: it does only what three r178+
     does on __THREE_DEVTOOLS__ — a 'register' event with the revision (?rev=, default 185) at module
     load, then an 'observe' event whose detail is the renderer (isWebGPURenderer: true, domElement:
     its canvas). The object has none of the common Renderer API (no backend, setViewport, …).
     Cases p-webgpu (?rev=190: a revision outside the driver's verified range) and p-webgpu-api
     (?rev=185: in range, but no Renderer API): the core loads (three announced itself), reports
     { status: 'flat', engine: 'three.js', reason } and converts nothing. The real WebGPURenderer is
     three-webgpu-orbit.html. -->
<html><head><meta charset="utf-8"><link rel="icon" href="data:,"><title>three WebGPURenderer stub (test)</title>
<style>body{margin:0;background:#111}canvas{display:block;width:640px;height:360px}</style>
</head><body>
<script>
(() => {
  const dt = () => window.__THREE_DEVTOOLS__;
  if (dt()) dt().dispatchEvent(new CustomEvent('register', { detail: { revision: new URLSearchParams(location.search).get('rev') || '185' } }));
  class WebGPURenderer {
    constructor() {
      this.isWebGPURenderer = true;
      this.domElement = document.createElement('canvas');
      this.domElement.width = 640; this.domElement.height = 360;
      if (dt()) dt().dispatchEvent(new CustomEvent('observe', { detail: this }));
    }
    render() {}
  }
  const r = new WebGPURenderer();
  document.body.appendChild(r.domElement);
  window.__stubRenderer = r;
  addEventListener('load', () => { document.documentElement.dataset.done = '1'; });
})();
</script>
</body></html>
