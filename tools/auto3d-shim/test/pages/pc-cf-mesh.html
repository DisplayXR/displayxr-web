<!doctype html>
<!-- TEST PAGE — PlayCanvas 2.23 (ESM, no globals) rendering through a CameraFrame: the engine's post
     chain (scene pass -> SSAO / TAA / bloom -> compose). A bright emissive sphere (HDR emissive, for
     the bloom glow) in front of a lit box, on a mid-grey clear colour so the vignette shows at the
     edges of each eye, and a dark bar low in the frame. Symmetric about x = 0 and the camera sits 8 units in front:
     expected convergence 8. Render on demand after 60 frames (window.__frozen).
       ?gpu=webgpu   a WebGPU device (createGraphicsDevice), else WebGL2
       ?bloom=0 ?ssao=0 ?taa=0 ?vignette=0   switch one effect off (all on by default)
     Hooks: window.__grabFrame() (read in the drawing task), __deviceType, __cf (the CameraFrame). -->
<html><head><meta charset="utf-8"><link rel="icon" href="data:,"><title>PlayCanvas CameraFrame meshes (test)</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#000}canvas{display:block;width:100%;height:100%}</style>
<script type="importmap">{ "imports": { "playcanvas": "/deps/playcanvas-2.23/playcanvas.mjs" } }</script>
</head><body>
<canvas id="cf-canvas"></canvas>
<script type="module">
import * as pc from 'playcanvas';
const q = new URLSearchParams(location.search);
const on = (k) => q.get(k) !== '0';
const canvas = document.getElementById('cf-canvas');
const device = await pc.createGraphicsDevice(canvas, { deviceTypes: [q.get('gpu') === 'webgpu' ? 'webgpu' : 'webgl2'], antialias: false });
window.__deviceType = device.deviceType;
const opts = new pc.AppOptions();
opts.graphicsDevice = device;
opts.componentSystems = [pc.CameraComponentSystem, pc.RenderComponentSystem, pc.LightComponentSystem];
opts.resourceHandlers = [];
const app = new pc.AppBase(canvas);
app.init(opts);
app.setCanvasFillMode(pc.FILLMODE_FILL_WINDOW);
app.setCanvasResolution(pc.RESOLUTION_AUTO);
addEventListener('resize', () => app.resizeCanvas());
window.__expectedConvergence = 8;

const camera = new pc.Entity('camera');
camera.addComponent('camera', { clearColor: new pc.Color(0.5, 0.5, 0.5), fov: 40, nearClip: 0.1, farClip: 100 });
camera.setPosition(0, 1, 8);
camera.lookAt(0, 1, 0);
app.root.addChild(camera);
const light = new pc.Entity('sun');
light.addComponent('light', { type: 'directional', intensity: 1.2 });
light.setEulerAngles(45, 30, 0);
app.root.addChild(light);
app.scene.ambientLight = new pc.Color(0.3, 0.3, 0.35);

const mat = (r, g, b, emissive) => {
  const m = new pc.StandardMaterial();
  m.diffuse = new pc.Color(r, g, b);
  if (emissive) { m.emissive = new pc.Color(1, 0.9, 0.6); m.emissiveIntensity = 12; m.useLighting = false; }
  m.update(); return m;
};
const add = (type, m, x, y, z, s, sy) => { const e = new pc.Entity(type); e.addComponent('render', { type, material: m }); e.setLocalPosition(x, y, z); e.setLocalScale(s, sy ?? s, s); app.root.addChild(e); return e; };
add('box', mat(0.2, 0.55, 0.9), 0, 1, -1.2, 2.2, 2.2);   // behind the sphere: SSAO creases + a lit face
add('sphere', mat(1, 1, 1, true), 0, 1, 0.6, 0.7);       // the bloom source
add('box', mat(0.85, 0.35, 0.2), -1.6, 1, 0, 0.5);
add('box', mat(0.85, 0.35, 0.2), 1.6, 1, 0, 0.5);
// A dark bar low in the frame: the picture is NOT up-down symmetric, so the out-cover check can tell a
// flipped cover from a right one (symmetric about x = 0, so the convergence target is unchanged).
add('box', mat(0.08, 0.1, 0.12), 0, -1.1, -1.2, 5, 0.5);

// The CameraFrame, configured as a page would, then update() once.
const cf = new pc.CameraFrame(app, camera.camera);
cf.rendering.toneMapping = pc.TONEMAP_ACES;
cf.bloom.intensity = on('bloom') ? 0.08 : 0;
cf.bloom.blurLevel = 6;
cf.ssao.type = on('ssao') ? pc.SSAOTYPE_COMBINE : pc.SSAOTYPE_NONE;
cf.ssao.radius = 40; cf.ssao.intensity = 0.6;
cf.taa.enabled = on('taa');
cf.taa.jitter = 1;
cf.grading.enabled = true; cf.grading.saturation = 1.1;
cf.vignette.intensity = on('vignette') ? 0.6 : 0;
cf.vignette.inner = 0.4; cf.vignette.outer = 1.0; cf.vignette.curvature = 0.5;
cf.update();
window.__cf = cf;

let n = 0;
app.on('update', () => { if (n >= 60) { app.autoRender = false; window.__frozen = true; return; } n++; window.__pageFrames = n; });

const CW = Object.getOwnPropertyDescriptor(HTMLCanvasElement.prototype, 'width');
const CH = Object.getOwnPropertyDescriptor(HTMLCanvasElement.prototype, 'height');
window.__grabFrame = () => new Promise((res) => {
  app.once('postrender', () => {
    if (app.graphicsDevice.isWebGPU) app.graphicsDevice.submit();
    const w = CW.get.call(canvas), h = CH.get.call(canvas);
    const c2 = document.createElement('canvas'); c2.width = w; c2.height = h;
    const g = c2.getContext('2d', { willReadFrequently: true }); g.drawImage(canvas, 0, 0);
    const d = g.getImageData(0, 0, w, h).data;
    let s = ''; for (let i = 0; i < d.length; i += 32768) s += String.fromCharCode.apply(null, d.subarray(i, i + 32768));
    res({ w, h, b64: btoa(s), png: c2.toDataURL('image/png') });
  });
  app.renderNextFrame = true;
});
app.start();
</script>
</body></html>
