<!doctype html>
<!-- TEST PAGE (v0.7.12, cases/walk.mjs) — open scenes that are not splats, and the eye anchor. No
     lookAt and no controls target anywhere (the camera is aimed through camera.rotation), so the
     convergence comes from the estimator and the open signals decide.
       ?scene=room   a mesh room: floor + four separate wall meshes (3 high) + crates; camera inside at eye height
       ?scene=model  a model viewer: a torus knot at (0, 1, 0) on a 40-unit floor, camera at (0, 1, 8) (harness case a's scene)
       ?scene=field  a floor and a few objects far ahead only (open ground, nothing around the camera)
       ?cam=still | walk (a first-person path: forward + turning about the camera) | orbit (about the model,
            radius 8, facing it, no lookAt) | dolly (along the view axis toward the model and back) |
            plc (still, plus a PointerLockControls-shaped window.controls on the camera) |
            fpc (still, a FirstPersonControls-shaped window.controls, lookAt 100 ahead every frame)
     Hooks: window.__camWorld(), window.__ready. -->
<html><head><meta charset="utf-8"><link rel="icon" href="data:,"><title>three walk (test)</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#20242c}canvas{display:block}</style>
<script type="importmap">{ "imports": { "three": "/deps/three/three.module.js" } }</script>
</head><body>
<script type="module">
import * as THREE from 'three';
const q = new URLSearchParams(location.search);
const SCENE = q.get('scene') || 'room', CAM = q.get('cam') || 'still';
const renderer = new THREE.WebGLRenderer({ antialias: false, preserveDrawingBuffer: true });
renderer.setPixelRatio(window.devicePixelRatio);
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x2a3040);
const camera = new THREE.PerspectiveCamera(40, innerWidth / innerHeight, 0.1, 200);
scene.add(new THREE.HemisphereLight(0xffffff, 0x444466, 1.2));
const sun = new THREE.DirectionalLight(0xffffff, 2);
sun.position.set(3, 6, 4);
scene.add(sun);
const mat = (color) => new THREE.MeshStandardMaterial({ color, roughness: 0.6 });
const mk = (geo, color, x, y, z) => { const m = new THREE.Mesh(geo, mat(color)); m.position.set(x, y, z); scene.add(m); return m; };
const floor = (size) => { const f = new THREE.Mesh(new THREE.PlaneGeometry(size, size), mat(0x556070)); f.rotation.x = -Math.PI / 2; scene.add(f); };
let start = [0, 1, 8], yaw0 = 0;
if (SCENE === 'room') {
  floor(12);
  const wallX = new THREE.BoxGeometry(12, 3, 0.2), wallZ = new THREE.BoxGeometry(0.2, 3, 12);
  mk(wallX, 0xb08060, 0, 1.5, -6); mk(wallX, 0x80b060, 0, 1.5, 6); mk(wallZ, 0x6080b0, -6, 1.5, 0); mk(wallZ, 0xb060a0, 6, 1.5, 0);
  const crate = new THREE.BoxGeometry(0.8, 0.8, 0.8);
  mk(crate, 0xc0a040, -3, 0.4, -3); mk(crate, 0xc0a040, 3.5, 0.4, -2); mk(crate, 0xc0a040, -2, 0.4, 3);
  start = [0, 1.6, 2];
} else if (SCENE === 'field') {
  floor(400);
  const pillar = new THREE.BoxGeometry(1, 3, 1);
  for (let i = -2; i <= 2; i++) mk(pillar, 0xd08050, i * 4, 1.5, -40);
  start = [0, 1.6, 10];
} else {
  floor(40);
  mk(new THREE.TorusKnotGeometry(0.55, 0.18, 96, 12), 0xff7a2f, 0, 1, 0);
  start = [0, 1, 8];
}
camera.position.set(...start);
camera.rotation.set(0, yaw0, 0);
if (CAM === 'fpc') window.controls = { object: camera, movementSpeed: 1, lookSpeed: 0.005, update() {} };
if (CAM === 'plc') window.controls = { object: camera, isLocked: false, pointerSpeed: 1, lock() {}, unlock() {}, connect() {}, disconnect() {} };
window.__camWorld = () => { camera.updateMatrixWorld(); return Array.from(camera.matrixWorld.elements); };
let n = 0;
function frame() {
  requestAnimationFrame(frame);
  n++;
  const t = n / 60;
  if (CAM === 'walk' && SCENE === 'room') {
    // a first-person stroll: round the room's middle, always facing the way it goes
    const a = t * 0.6;
    camera.position.set(2 * Math.sin(a), 1.6, 2 * Math.cos(a));
    camera.rotation.set(0, a - Math.PI / 2, 0);
  } else if (CAM === 'walk') {
    // forward across open ground, looking a little left and right as it goes
    const yaw = 0.35 * Math.sin(t * 1.5);
    camera.rotation.set(0, yaw, 0);
    camera.position.set(start[0] - 0.5 * Math.sin(t * 0.4), start[1], start[2] - 3 * t);
  } else if (CAM === 'orbit') {
    // orbits the model at radius 8, always facing it (a scripted turntable camera)
    const a = t * 0.5;
    camera.position.set(8 * Math.sin(a), 1, 8 * Math.cos(a));
    camera.rotation.set(0, a, 0);
  } else if (CAM === 'dolly') {
    camera.position.set(0, 1, 6 + 2 * Math.cos(t * 0.8));
  }
  if (CAM === 'fpc') { const d = new THREE.Vector3(); camera.getWorldDirection(d); camera.lookAt(camera.position.clone().addScaledVector(d, 100)); } // FirstPersonControls.update()
  renderer.render(scene, camera);
  if (n === 30) window.__ready = true;
}
requestAnimationFrame(frame);
</script>
</body></html>
