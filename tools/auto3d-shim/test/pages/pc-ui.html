<!doctype html>
<!-- TEST PAGE — a PlayCanvas (2.x, ESM, no globals) page that is ONLY screen-space UI at first: a
     ScreenComponent (screenSpace) with image elements, no mesh, no splat (a 2D menu / loading screen).
     Nothing has depth, so the adapter must leave it 2D with the reason. ?add3dMs=N: after N ms the page
     adds a 3D box in front of the camera (the scene loaded), which must then convert. ?lines=1: immediate-mode
     lines every frame (app.drawLine): 3D, must convert. ?stats=1: MiniStats on (the examples' stats
     toggle), which is screen-space: must stay 2D.
     playcanvas.com/examples user-interface/* (2.24) were converted into two identical halves. -->
<html><head><meta charset="utf-8"><link rel="icon" href="data:,"><title>PlayCanvas screen UI (test)</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#20242c}canvas{display:block;width:100%;height:100%}</style>
<script type="importmap">{ "imports": { "playcanvas": "/deps/playcanvas/playcanvas.mjs" } }</script>
</head><body>
<canvas id="application-canvas"></canvas>
<script type="module">
import * as pc from 'playcanvas';
const q = new URLSearchParams(location.search);
const canvas = document.getElementById('application-canvas');
const app = new pc.Application(canvas, { graphicsDeviceOptions: { antialias: false, preserveDrawingBuffer: true, deviceTypes: ['webgl2'] } });
app.setCanvasFillMode(pc.FILLMODE_FILL_WINDOW);
app.setCanvasResolution(pc.RESOLUTION_AUTO);
addEventListener('resize', () => app.resizeCanvas());
const camera = new pc.Entity('camera');
camera.addComponent('camera', { clearColor: new pc.Color(0.16, 0.19, 0.25), fov: 40, nearClip: 0.1, farClip: 100 });
camera.setPosition(0, 0, 8);
app.root.addChild(camera);
const screen = new pc.Entity('screen');
screen.addComponent('screen', { referenceResolution: new pc.Vec2(1280, 720), scaleBlend: 0.5, scaleMode: pc.SCALEMODE_BLEND, screenSpace: true });
app.root.addChild(screen);
const panel = (x, y, w, h, c) => {
  const e = new pc.Entity('panel');
  e.addComponent('element', { type: 'image', anchor: [0.5, 0.5, 0.5, 0.5], pivot: [0.5, 0.5], width: w, height: h, color: c, opacity: 1 });
  e.setLocalPosition(x, y, 0);
  screen.addChild(e);
  return e;
};
panel(0, 120, 360, 80, new pc.Color(1, 0.55, 0.2));
panel(0, 0, 360, 80, new pc.Color(0.3, 0.35, 0.5));
panel(0, -120, 360, 80, new pc.Color(0.3, 0.35, 0.5));
const add3dMs = +q.get('add3dMs') || 0;
if (add3dMs) setTimeout(() => {
  const m = new pc.StandardMaterial(); m.diffuse = new pc.Color(0.2, 0.7, 1); m.update();
  const box = new pc.Entity('box'); box.addComponent('render', { type: 'box', material: m });
  box.setLocalScale(2, 2, 2); app.root.addChild(box);
  const light = new pc.Entity('sun'); light.addComponent('light', { type: 'directional' }); light.setEulerAngles(45, 30, 0); app.root.addChild(light);
  window.__added3d = performance.now();
}, add3dMs);
// ?stats=1: the engine's MiniStats overlay (a quad batch of its own, screen-space): still nothing 3D.
if (q.has('stats')) window.__stats = new pc.MiniStats(app);
// ?lines=1: the page also draws immediate-mode lines (app.drawLine, as debug/wire-shapes does): 3D, converts.
const lines = q.has('lines');
let n = 0;
app.on('update', () => {
  if (lines) app.drawLine(new pc.Vec3(-2, -1, 0), new pc.Vec3(2, 1, -2), pc.Color.WHITE);
  if (++n >= 30) window.__frozen = true;
});
app.start();
</script>
</body></html>
