<!doctype html>
<meta charset="utf-8">
<title>lift native-mode harness</title>
<!-- Driven by test/lift-native.run.mjs (NOT part of npm test: needs a GPU browser). Fakes the
     DisplayXR Browser's lift world by answering displayxr-lift:// in window.fetch, then runs the
     REAL lift() on an <img> and a <video>. -->
<script type="importmap">
{ "imports": { "playcanvas": "/tools/lift-builtin/node_modules/playcanvas/build/playcanvas.mjs" } }
</script>
<style>body{margin:0;background:#222} img,video{display:block;width:640px;height:360px;margin:8px}</style>
<img id="img">
<video id="vid" muted playsinline loop src="/test/lift-dibr-clip.mp4"></video>
<script type="module">
const log = [];
const net = { caps: 0, depth: 0, gaussians: 0, other: [] };
let depthStatus = 200;
let fakeSog = null; // the first lift's own .sog stands in for the module's gaussians answer
const realFetch = window.fetch.bind(window);
window.fetch = async (input, init = {}) => {
  const url = typeof input === 'string' ? input : input.url;
  if (url.startsWith('displayxr-lift://')) {
    if (url === 'displayxr-lift://caps') {
      net.caps++;
      return new Response(JSON.stringify({ native: true, provider: 'fake-npu', modes: ['depth', 'sbs'], maxStreams: 2, approxMsPerConvert: 12, state: 'ready' }), { headers: { 'content-type': 'application/json' } });
    }
    if (url === 'displayxr-lift://lift/depth') {
      net.depth++;
      if (depthStatus !== 200) return new Response('x', { status: depthStatus });
      const bmp = await createImageBitmap(init.body);
      const w = 256, h = 144, d = new Float32Array(w * h);
      for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
        const cx = x - w / 2, cy = y - h / 2;
        d[y * w + x] = Math.hypot(cx / w, cy / h) < 0.2 ? 1.2 : 2.5 + 0.5 * (y / h); // a near disc on a wall
      }
      bmp.close();
      return new Response(d.buffer, { headers: { 'content-type': 'application/octet-stream', 'x-dxr-depth-width': String(w), 'x-dxr-depth-height': String(h), 'x-dxr-depth-semantics': 'metric', 'x-dxr-depth-focalpx': '230' } });
    }
    if (url === 'displayxr-lift://lift/gaussians') {
      net.gaussians++;
      return fakeSog ? new Response(fakeSog, { headers: { 'content-type': 'application/octet-stream' } }) : new Response('no', { status: 404 });
    }
    throw new TypeError('Failed to fetch');
  }
  if (!url.startsWith(location.origin)) net.other.push(url);
  return realFetch(input, init);
};

const c = document.createElement('canvas');
c.width = 640; c.height = 360;
const g = c.getContext('2d');
const grd = g.createLinearGradient(0, 0, 640, 360);
grd.addColorStop(0, '#3a6'); grd.addColorStop(1, '#236');
g.fillStyle = grd; g.fillRect(0, 0, 640, 360);
g.fillStyle = '#e84'; g.beginPath(); g.arc(320, 180, 70, 0, 7); g.fill();
const img = document.getElementById('img');
img.src = c.toDataURL('image/png');
await img.decode();

const { lift, liftCapabilities } = await import('/js/lift/index.js');
const attrs = (el) => Object.fromEntries([...el.attributes].filter((a) => a.name.startsWith('dxr-lift')).map((a) => [a.name, a.value]));
const waitState = (h, s, ms = 60000) => new Promise((res, rej) => {
  if (h.state === s) return res();
  const off = h.on('statechange', ({ state }) => { if (state === s) { off(); res(); } });
  setTimeout(() => rej(new Error(`timeout waiting for ${s} (at ${h.state})`)), ms);
});

window.__run = async () => {
  const out = {};
  out.caps = await liftCapabilities({ webFallback: false });
  // ── image ──
  const h = await lift(img, { mode: 'live' }); // an explicit live picture (the non-default path)
  await waitState(h, 'live');
  const I = h._internals();
  out.img = {
    state: h.state, native: h.native, mode: h.stats.mode, provider: h.stats.provider, attrs: attrs(img),
    canvasVisibility: h.canvas.style.visibility, imgVisibility: img.style.visibility, dibr: !!I.dibr, stillProv: !!I.stillProv,
  };
  out.img.setPriority = h.setPriority('high');
  out.img.setPriorityBad = h.setPriority('turbo');
  h.setDepth(1.5); h.setConvergence(0.4);
  out.img.attrs2 = attrs(img);
  const t0 = performance.now();
  h.explore();
  await waitState(h, 'explore', 120000);
  out.img.exploreMs = Math.round(performance.now() - t0);
  out.img.explore = { attrs: attrs(img), canvasVisibility: h.canvas.style.visibility, imgVisibility: img.style.visibility, splats: h.stats.splats, stillDepthMs: h.stats.stillDepthMs, depthPosts: net.depth, stillProv: h._internals().stillProv?.id, stillSource: h._internals().stillProv?.info?.source };
  await new Promise((r) => setTimeout(r, 500));
  out.img.png = await h.capture().then((b) => new Promise((r) => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(b); })).catch((e) => 'ERR ' + e.message);
  // orbit relax: yaw must start heading home on the release frame (no hold). Per-rAF samples.
  {
    const ex = h._internals().explore;
    const raf = () => new Promise((r) => requestAnimationFrame(() => r()));
    const r = h.canvas.getBoundingClientRect();
    const ev = (type, dx, extra = {}) => new PointerEvent(type, { clientX: r.left + r.width / 2 + dx, clientY: r.top + r.height / 2, bubbles: true, composed: true, cancelable: true, pointerId: 7, isPrimary: true, pointerType: 'mouse', buttons: 1, ...extra });
    h.canvas.dispatchEvent(ev('pointerdown', 0));
    for (let i = 1; i <= 10; i++) { h.canvas.dispatchEvent(ev('pointermove', i * 25)); await raf(); }
    for (let i = 0; i < 30; i++) await raf(); // hold still: yaw settles on the drag target
    const held = { yaw: ex.orbit.yaw, target: ex.orbit.targetYaw, mode: ex.orbit.mode };
    const tUp = performance.now();
    h.canvas.dispatchEvent(ev('pointerup', 250, { buttons: 0 }));
    const atUp = { yaw: ex.orbit.yaw, target: ex.orbit.targetYaw, mode: ex.orbit.mode };
    const after = [];
    for (let i = 0; i < 8; i++) { await raf(); after.push({ dtMs: Math.round(performance.now() - tUp), yaw: +ex.orbit.yaw.toFixed(3), frames: ex.stats.frames }); }
    out.img.relax = { held, atUp, after };
    // the same with REAL (CDP) mouse input: sample (t, yaw, mode) every rAF across the release
    if (window.__mouse) {
      await raf(); for (let i = 0; i < 90; i++) await raf(); // settle home first
      const samples = [];
      let sampling = true;
      const t0 = performance.now();
      const loop = () => { samples.push([Math.round(performance.now() - t0), +ex.orbit.yaw.toFixed(3), ex.orbit.mode]); if (sampling) requestAnimationFrame(loop); };
      requestAnimationFrame(loop);
      let tUpDispatch = 0, tUpSeen = 0;
      const seenUp = () => { tUpSeen = Math.round(performance.now() - t0); };
      h.canvas.addEventListener('pointerup', seenUp, { once: true });
      const cx = r.left + r.width / 2, cy = r.top + r.height / 2;
      await window.__mouse([['move', cx, cy], ['down'], ['move', cx + 200, cy, 12], ['wait', 500]]);
      tUpDispatch = Math.round(performance.now() - t0);
      await window.__mouse([['up']]);
      await new Promise((res) => setTimeout(res, 400));
      sampling = false;
      const iRest = samples.findIndex((s) => s[2] === 'rest');
      const afterUp = samples.filter((s) => s[0] >= tUpDispatch).slice(0, 6);
      const upIdx = samples.findIndex((s) => s[0] >= tUpDispatch);
      const yawAtUp = upIdx > 0 ? samples[upIdx - 1][1] : null;
      out.img.relaxReal = {
        tUpDispatch, tUpSeen, peakYaw: Math.max(...samples.map((s) => s[1])), yawAtUp, afterUp,
        // PASS: the yaw is below its release value within the first 2 rAFs after the (trusted) mouseup
        decreasingWithin2Rafs: yawAtUp !== null && samples.slice(upIdx, upIdx + 2).some((s) => s[1] < yawAtUp),
        lastRelease: ex.stats.lastRelease,
      };
    }
  }
  fakeSog = await h.exportSog().then((b) => b.arrayBuffer()).catch(() => null);
  h.resume();
  await waitState(h, 'live');
  await new Promise((r) => setTimeout(r, 600)); // fade out
  out.img.back = { state: h.state, attrs: attrs(img), canvasVisibility: h.canvas.style.visibility, imgVisibility: img.style.visibility };
  h.remove();
  out.img.removed = { attrs: attrs(img), imgVisibility: img.style.visibility, hosts: document.querySelectorAll('[data-inline3d-lift]').length };

  // ── the chip auto-hides in native mode (the lift crop would weave it) ──
  {
    const hc = await lift(img, { mode: 'live', ui: { autoHideMs: 300 } });
    await waitState(hc, 'live');
    const chip = hc._internals().chip;
    const r = img.getBoundingClientRect();
    out.chip = { atMount: chip.visible };
    await new Promise((res) => setTimeout(res, 700));
    out.chip.afterQuiet = chip.visible;
    out.chip.opacityHidden = getComputedStyle(chip.el).opacity;
    out.chip.visibilityHidden = getComputedStyle(chip.el).visibility;
    document.dispatchEvent(new PointerEvent('pointermove', { clientX: r.left + r.width / 2, clientY: r.top + r.height / 2, bubbles: true }));
    out.chip.afterMoveInside = chip.visible;
    await new Promise((res) => setTimeout(res, 700));
    document.dispatchEvent(new PointerEvent('pointermove', { clientX: r.right + 50, clientY: r.bottom + 50, bubbles: true }));
    out.chip.afterMoveOutside = chip.visible;
    hc.remove();
    const hd = await lift(img, { mode: 'live' }); // default autoHide: native → 2500 ms
    await waitState(hd, 'live');
    out.chip.defaultNativeVisibleAt0 = hd._internals().chip.visible;
    out.chip.defaultNativeClass = hd._internals().chip.el.className;
    hd.remove();
  }

  // ── ownLiftAttr: the browser's menu pre-sets dxr-lift="auto" before lift() ──
  {
    out.own = {};
    img.setAttribute('dxr-lift', 'auto');
    const ho = await lift(img, { mode: 'live', ownLiftAttr: true });
    await waitState(ho, 'live');
    ho.remove();
    out.own.withOption = attrs(img); // expect {}
    img.setAttribute('dxr-lift', 'auto');
    const hp = await lift(img, { mode: 'live' });
    await waitState(hp, 'live');
    hp.remove();
    out.own.without = attrs(img); // expect { 'dxr-lift': 'auto' } (page-owned, restored)
    img.removeAttribute('dxr-lift');
    // the built-in bundle (npm run build:lift-builtin → /lift-sdk/), as the browser injects it
    if (await realFetch('/lift-sdk/displayxr-lift-builtin.js', { method: 'HEAD' }).then((r) => r.ok, () => false)) {
      await new Promise((res, rej) => { const sc = document.createElement('script'); sc.src = '/lift-sdk/displayxr-lift-builtin.js'; sc.onload = res; sc.onerror = rej; document.head.append(sc); });
      const B = globalThis.__dxrLift;
      const r = img.getBoundingClientRect();
      const x = r.left + r.width / 2, y = r.top + r.height / 2;
      img.setAttribute('dxr-lift', 'auto'); // what lift_trigger.cc does before convertAt
      const writes = [];
      const mo = new MutationObserver((ms) => ms.forEach((m) => m.attributeName.startsWith('dxr-lift') && writes.push([m.attributeName, img.getAttribute(m.attributeName)])));
      mo.observe(img, { attributes: true });
      out.own.builtinLift = await B.convertAt(x, y, 'image');
      out.own.builtinLiveAttrs = attrs(img); // a picture: {} — the menu's pre-set is dropped
      for (let i = 0; i < 1200 && B.status().lifts[0]?.state !== 'explore'; i++) await new Promise((res) => setTimeout(res, 100));
      mo.disconnect();
      out.own.builtinPictureState = B.status().lifts[0]?.state;
      out.own.builtinPictureAttrWrites = writes; // expect only the removal of the pre-set: [['dxr-lift', null]]
      out.own.builtinToggle = await B.convertAt(x, y, 'image'); // toggle-off
      out.own.builtinAfterToggle = attrs(img); // expect {}
      img.setAttribute('dxr-lift', 'auto');
      await B.convertAt(x, y, 'image');
      B.cancelAll();
      out.own.builtinAfterCancelAll = attrs(img); // expect {}
      out.own.builtinLifts = B.status().lifts.length;
    } else out.own.builtin = 'SKIPPED: run npm run build:lift-builtin first';
  }

  // ── a picture by default: straight to explore, no live phase, no dxr-lift ever, chip = ↓SOG + Exit ──
  {
    const writes = [];
    const mo = new MutationObserver((ms) => ms.forEach((m) => m.attributeName.startsWith('dxr-lift') && writes.push([m.attributeName, img.getAttribute(m.attributeName)])));
    mo.observe(img, { attributes: true });
    const hs = await lift(img);
    const states = [hs.state];
    hs.on('statechange', ({ state }) => states.push(state));
    await waitState(hs, 'explore', 120000);
    mo.disconnect();
    const chipEl = hs._internals().chip.el;
    out.picture = {
      states, attrWrites: writes, attrs: attrs(img),
      chipButtons: [...chipEl.querySelectorAll('button')].filter((b) => !b.hidden).map((b) => b.textContent),
      chipLabelHidden: chipEl.querySelector('.label').hidden,
      resumeIgnored: (hs.resume(), hs.state),
    };
    hs.remove();
  }

  // ── image, module WITH gaussians: the explore scene comes from POST lift/gaussians ──
  {
    const hg = await lift(img, { native: { ...out.caps, modes: ['depth', 'sbs', 'gaussians'] } });
    const d0 = net.depth, g0 = net.gaussians;
    await waitState(hg, 'explore', 120000); // a picture goes straight to explore
    out.gauss = { fakeSogBytes: fakeSog ? fakeSog.byteLength : 0, gaussiansPosts: net.gaussians - g0, depthPosts: net.depth - d0,
      liftSource: hg.stats.liftSource, liftProv: hg._internals().liftProv?.id ?? null, attrs: attrs(img), canExport: hg.canExport };
    await new Promise((r) => setTimeout(r, 400));
    out.gauss.png = await hg.capture().then((b) => new Promise((r) => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(b); })).catch((e) => 'ERR ' + e.message);
    hg.remove();
  }

  // ── video ──
  const vid = document.getElementById('vid');
  await vid.play().catch(() => {});
  const hv = await lift(vid);
  await waitState(hv, 'live');
  const V = hv._internals();
  out.vid = { state: hv.state, native: hv.native, attrs: attrs(vid), dibr: !!V.dibr, videoProv: !!V.videoProv, modelLoadMs: hv.stats.modelLoadMs };
  // play must never wait on explore work: resume mid-lift → live + dxr-lift="auto" in the same tick
  {
    const errs = [];
    const offErr = hv.on('error', (e) => errs.push(String(e.error && e.error.message)));
    hv.explore();
    await new Promise((r) => setTimeout(r, 30));
    const during = hv.state;
    hv.resume();
    out.vid.resumeMidLift = { during, syncState: hv.state, syncAttrs: attrs(vid) };
    await new Promise((r) => setTimeout(r, 2500)); // let the abandoned work settle
    out.vid.resumeMidLift.after = { state: hv.state, attrs: attrs(vid), paused: vid.paused, errors: errs };
    offErr();
  }
  // native default mode is 'live': a pause never lifts (no depth POST, stays live, still converted)
  {
    const d0 = net.depth;
    vid.pause();
    await new Promise((r) => setTimeout(r, 1500));
    out.vid.pauseNoLift = { mode: 'default', state: hv.state, depthPostsOnPause: net.depth - d0, attrs: attrs(vid) };
    await vid.play().catch(() => {});
  }
  // explore input never reaches the player; Resume → the PAUSED frame; only an explicit play plays
  {
    const X = (out.vid.exploreInput = {});
    hv.explore();
    await waitState(hv, 'explore', 120000);
    let playCalls = 0;
    const realPlay = vid.play.bind(vid);
    vid.play = () => { playCalls++; return realPlay(); };
    const seen = [];
    const spy = (e) => seen.push(e.type);
    const kinds = ['pointerdown', 'pointermove', 'pointerup', 'mousedown', 'mouseup', 'click'];
    for (const k of kinds) { vid.parentElement.addEventListener(k, spy); document.addEventListener(k, spy); }
    const r = hv.canvas.getBoundingClientRect();
    const at = (dx) => ({ clientX: r.left + r.width / 2 + dx, clientY: r.top + r.height / 2, bubbles: true, composed: true, cancelable: true, pointerId: 1, isPrimary: true, pointerType: 'mouse', buttons: 1 });
    hv.canvas.dispatchEvent(new PointerEvent('pointerdown', at(0)));
    for (let i = 1; i <= 5; i++) hv.canvas.dispatchEvent(new PointerEvent('pointermove', at(i * 20)));
    hv.canvas.dispatchEvent(new PointerEvent('pointerup', { ...at(100), buttons: 0 }));
    hv.canvas.dispatchEvent(new MouseEvent('click', at(100))); // the synthetic click after a drag
    await new Promise((res) => setTimeout(res, 300));
    X.afterDrag = { state: hv.state, paused: vid.paused, playCalls, reachedPage: seen.slice() };
    for (const k of kinds) { vid.parentElement.removeEventListener(k, spy); document.removeEventListener(k, spy); }
    hv.resume(); // chip Resume
    X.afterResume = { state: hv.state, paused: vid.paused, playCalls, attrs: attrs(vid) };
    await new Promise((res) => setTimeout(res, 500));
    X.afterResumeSettled = { state: hv.state, paused: vid.paused, playCalls };
    await hv.play(); // explicit play
    await new Promise((res) => setTimeout(res, 300));
    X.afterPlay = { state: hv.state, paused: vid.paused, playCalls };
    vid.play = realPlay;
  }
  depthStatus = 500; // the module's depth fails → the ORT still model is the fallback (not loaded here: no models)
  hv.explore(); // explicit: the only thing that lifts in native mode
  await new Promise((r) => setTimeout(r, 3000));
  out.vid.afterPauseFail = { state: hv.state, depthPosts: net.depth, attrs: attrs(vid) };
  hv.remove();
  out.vid.removed = attrs(vid);
  out.net = net;
  out.log = log;
  return out;
};
console.log('NATIVE READY');
</script>
