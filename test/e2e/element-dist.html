<!doctype html>
<!-- test/e2e/element-dist.html — `<dxr-call>` from the CDN BUNDLE (dist/call.js, built by
     `npm run build:dist`): the paste-and-go form of RFC 0003 §1, served locally instead of from
     jsDelivr. Same page as element.html otherwise. Driven by test/e2e/call-element.e2e.mjs. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>dxr-call e2e (dist bundle)</title>
<script>
  window.__events = [];
  for (const t of ['ready', 'joined', 'left', 'peer', 'peerleft', 'state', 'format', 'speaker', 'quality', 'error', 'warning']) {
    document.addEventListener('dxr-call:' + t, (e) => {
      // `ready` carries the handle (not serialisable, and its diagnostics include the session's
      // short-lived TURN credentials — keep those out of any log); everything else is plain data.
      let d = null;
      if (t === 'ready') d = { state: e.detail.call.state, peers: e.detail.call.peers.map((p) => p.id) };
      else try { d = JSON.parse(JSON.stringify(e.detail, (k, v) => (v instanceof Error ? String(v) : v))); } catch { d = String(e.detail); }
      window.__events.push({ t, d, at: performance.now() });
    });
  }
</script>
<script type="module" src="/dist/call.js"></script>
</head>
<body>
<dxr-call auto-join no-ui></dxr-call>
</body>
</html>
