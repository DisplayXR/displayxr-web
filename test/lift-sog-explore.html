<script type="importmap">{ "imports": { "playcanvas": "https://cdn.jsdelivr.net/npm/playcanvas@2.22.3/build/playcanvas.mjs" } }</script>

const dibr = createLiveDibr({ canvas });

gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, junk, 0); gl.bindFramebuffer(gl.FRAMEBUFFER, null);

let dirtyOn = !new URLSearchParams(location.search).has('clean');

    if (on('premul')) gl.pixelStorei(gl.UNPACK_PREMULTIPLY_ALPHA_WEBGL, true);

console.log('SOG READY');
