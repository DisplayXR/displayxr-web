# Template for the dxr-signal/1 reference server on Cloudflare Workers + Durable Objects.
# NOT deployed by this repo. Copy, set `name` / routes for your account, then `wrangler deploy`.
#
# Secrets are NEVER written here. Set them with:
#   wrangler secret put TURN_KEY_API_TOKEN
# and put the (non-secret) TURN key id in [vars] or as a secret too.

name = "dxr-signal"
main = "worker.mjs"
compatibility_date = "2026-09-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "CallRoom"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["CallRoom"]

[vars]
# Participants per room (the client's maxPeers is clamped to this). Full mesh: keep it at 4.
MAX_PEERS = "4"
# Comma-separated list of page origins allowed to connect; empty = any origin.
ALLOWED_ORIGINS = ""
# Cloudflare Realtime TURN key id (Dashboard → Realtime → TURN). Leave empty for STUN-only.
TURN_KEY_ID = ""
# Lifetime of the TURN credentials handed to each joining client, seconds (60-86400).
TURN_TTL = "3600"
# TURN_KEY_API_TOKEN: set with `wrangler secret put TURN_KEY_API_TOKEN` — never here.
